
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠商發票登錄</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 30px 15px;
    color: #333;
}

.container {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
}

h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
    color: #2c3e50;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd2d8;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #2878d0;
    box-shadow: 0 0 0 2px rgba(40, 120, 208, 0.12);
}

button {
    width: 100%;
    padding: 13px;
    background: #2878d0;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #1d62ad;
}

button:disabled {
    background: #9aa8b5;
    cursor: wait;
}

#resultBox {
    display: none;
    margin-top: 24px;
}

#resultBox h3 {
    color: #2c3e50;
    font-size: 18px;
}

#resultFrame {
    width: 100%;
    height: 250px;
    border: 1px solid #dce3ea;
    border-radius: 6px;
    background: #fff;
}

#status {
    margin-top: 15px;
    font-size: 14px;
    color: #666;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">
    <h2>廠商發票登錄</h2>

    <form
        id="invoiceForm"
        action="http://airrex.tw:2918/airrex/amber/invoice.pl"
        method="POST"
        target="resultFrame">

        <div class="form-group">
            <label for="invoice_no">發票號碼</label>
            <input
                type="text"
                id="invoice_no"
                name="invoice_no"
                placeholder="例如：AB12345678"
                maxlength="20"
                required>
        </div>

        <div class="form-group">
            <label for="tax_id">統一編號</label>
            <input
                type="text"
                id="tax_id"
                name="tax_id"
                placeholder="請輸入 8 位統一編號"
                inputmode="numeric"
                pattern="[0-9]{8}"
                maxlength="8"
                required>
        </div>

        <div class="form-group">
            <label for="amount">發票金額</label>
            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="請輸入發票金額"
                min="0.01"
                step="0.01"
                required>
        </div>

        <div class="form-group">
            <label for="invoice_date">發票日期</label>
            <input
                type="date"
                id="invoice_date"
                name="invoice_date"
                required>
        </div>

        <button type="submit" id="submitBtn">
            送出發票資料
        </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <div id="resultBox">
        <h3>伺服器回傳結果</h3>

        <iframe
            id="resultFrame"
            name="resultFrame"
            title="伺服器回傳結果">
        </iframe>
    </div>
</div>

<script>
const form = document.getElementById("invoiceForm");
const submitBtn = document.getElementById("submitBtn");
const resultBox = document.getElementById("resultBox");
const resultFrame = document.getElementById("resultFrame");
const status = document.getElementById("status");

let submitted = false;

form.addEventListener("submit", function () {
    submitted = true;

    submitBtn.disabled = true;
    submitBtn.textContent = "資料送出中...";
    status.textContent = "正在傳送發票資料，請稍候...";
    resultBox.style.display = "block";
});

resultFrame.addEventListener("load", function () {
    if (!submitted) {
        return;
    }

    submitted = false;

    submitBtn.disabled = false;
    submitBtn.textContent = "送出發票資料";
    status.textContent = "伺服器已回應，請查看下方結果。";
});
</script>

</body>
</html>
