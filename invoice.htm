
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠商發票登錄</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 30px 15px;
        color: #333;
    }

    .container {
        max-width: 500px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    h2 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 25px;
        color: #2c3e50;
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccd2d8;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #2878d0;
        box-shadow: 0 0 0 2px rgba(40, 120, 208, 0.12);
    }

    button {
        width: 100%;
        padding: 13px;
        background: #2878d0;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #1d62ad;
    }

    button:disabled {
        background: #9aa8b5;
        cursor: wait;
    }

    #result {
        display: none;
        margin-top: 22px;
        padding: 15px;
        border-radius: 6px;
        background: #f1f5f9;
        border: 1px solid #dce3ea;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.6;
    }

    #result.error {
        color: #b42318;
        background: #fff1f0;
        border-color: #f5c2c0;
    }

    #result.success {
        color: #216e39;
    }
</style>
</head>

<body>

<div class="container">
    <h2>廠商發票登錄</h2>

    <form id="invoiceForm">
        <div class="form-group">
            <label for="invoice_no">發票號碼</label>
            <input
                type="text"
                id="invoice_no"
                name="invoice_no"
                placeholder="例如：AB12345678"
                maxlength="20"
                required>
        </div>

        <div class="form-group">
            <label for="tax_id">統一編號</label>
            <input
                type="text"
                id="id"
                name="id"
                placeholder="請輸入統一編號"
                inputmode="numeric"
                pattern="[0-9]{8}"
                maxlength="8"
                required>
        </div>

        <div class="form-group">
            <label for="amount">發票金額</label>
            <input
                type="number"
                id="pw"
                name="pw"
                placeholder="未稅或含稅都輸入看看"
                min="0.01"
                step="0.01"
                required>
        </div>

        <div class="form-group">
            <label for="invoice_date">發票日期</label>
            <input
                type="date"
                id="invoice_date"
                name="invoice_date"
                required>
        </div>

        <button type="submit" id="submitBtn">送出發票資料</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
</div>

<script>
const API_URL = "https://air-rex.com.tw/Myjob/proxy.php";

const form = document.getElementById("invoiceForm");
const result = document.getElementById("result");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    result.style.display = "block";
    result.className = "";
    result.textContent = "資料送出中，請稍候……";
    submitBtn.disabled = true;

    try {
        const formData = new FormData(form);

        const response = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        const responseText = await response.text();

        if (!response.ok) {
            throw new Error(
                "伺服器回應 HTTP " + response.status +
                "\n" + responseText
            );
        }

        result.className = "success";
        result.textContent = responseText || "伺服器已回應，但沒有回傳內容。";

    } catch (error) {
        result.className = "error";
        result.textContent =
            "送出失敗：" + error.message +
            "\n\n請確認伺服器網址、網路連線及跨來源存取設定。";
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
